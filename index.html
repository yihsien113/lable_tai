<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>台尺標籤</title>

    <link rel="stylesheet" href="tai.css">
</head>

<body>

<div id="vendorModal" class="modal-overlay" onclick="closeVendorModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>輸入或選擇廠商</h3>
        <input type="text" id="vendorInput" placeholder="輸入編號 (如:06) 或 名稱" autocomplete="off">
        <ul id="vendorDropdown" class="dropdown-list"></ul>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" onclick="closeVendorModal()">取消</button>
            <button class="modal-btn modal-btn-confirm" onclick="applyVendor()">確認並帶入</button>
        </div>
    </div>
</div>

<div class="main-container">
    <!-- 左側控制與預覽區 -->
    <div class="left-panel">
        <div class="title">台尺標籤</div>

        <div class="input-group">
            <div class="input-field">
                <label for="height">高</label>
                <input type="number" id="height" placeholder="0" step="any" onclick="this.select()">
            </div>
            <span class="multiply-symbol">×</span>
            <div class="input-field">
                <label for="width">寬</label>
                <input type="number" id="width" placeholder="0" step="any" onclick="this.select()">
            </div>
            <span class="unit-tag">台尺</span>
        </div>

        <div class="controls-panel">
            <div class="line-tag-group">
                <div class="tag-header">
                    <span>細項二 快速選項</span>
                    <button class="btn-add-select" onclick="addSelect(2)">+ 增加</button>
                </div>
                <div id="select-container-2" class="select-container"></div>
            </div>

            <div class="line-tag-group">
                <div class="tag-header">
                    <span>細項三 快速選項</span>
                    <button class="btn-add-select" onclick="addSelect(3)">+ 增加</button>
                </div>
                <div id="select-container-3" class="select-container"></div>
            </div>
        </div>

        <div class="label-preview-container">
            <div class="preview-title">標籤預覽 (視覺放大 2 倍，方便操作)</div>
            <div class="preview-scale-wrapper">
                <div id="print-area">
                    <div class="label-grid">
                        <div class="grid-cell col-left">
                            <div class="auto-fit-left" id="preview-vendor" onclick="openVendorModal()" title="點擊選擇或輸入廠商">廠商名稱</div>
                        </div>

                        <div class="grid-cell">
                            <div class="auto-fit-right" id="label-item-1" contenteditable="true" spellcheck="false"
                                 onclick="selectAllText(this)" oninput="autoFitRight(this)"></div>
                        </div>

                        <div class="grid-cell">
                            <div class="auto-fit-right" id="label-wrapper-2" onclick="focusEditable(2)">
                                <span id="label-item-2" class="editable-span" contenteditable="true" spellcheck="false"
                                      onclick="selectAllText(this); event.stopPropagation();"
                                      oninput="autoFitRight(document.getElementById('label-wrapper-2'))"></span><span id="label-tags-2" class="readonly-tags"></span>
                            </div>
                        </div>

                        <div class="grid-cell">
                            <div class="auto-fit-right" id="label-wrapper-3" onclick="focusEditable(3)">
                                <span id="label-item-3" class="editable-span" contenteditable="true" spellcheck="false"
                                      onclick="selectAllText(this); event.stopPropagation();"
                                      oninput="autoFitRight(document.getElementById('label-wrapper-3'))"></span><span id="label-tags-3" class="readonly-tags"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-action-group">
            <button class="btn-add" onclick="addToBatch()">加入批次清單</button>
            <button class="btn-print" onclick="printSingle()">列印目前單張</button>
            <button class="btn-reset" onclick="resetForm()">清除重設</button>
        </div>
    </div>

    <!-- 右側批次清單區 -->
    <div class="right-panel">
        <div class="batch-section">
            <div class="batch-header">
                <span class="batch-title" id="batch-count-title">待列印清單 (0 張)</span>
                <button class="btn-clear" onclick="clearBatch()">清空全部</button>
            </div>

            <div class="batch-controls" id="batch-controls" style="display: none;">
                <label class="checkbox-label">
                    <input type="checkbox" id="selectAllCheckbox" class="batch-checkbox" onchange="toggleSelectAll(this)"> 全選
                </label>
                <button class="btn-batch-apply" onclick="applyToSelected()">套用預覽「廠商與細項備註」至勾選項目</button>
            </div>

            <div class="batch-list" id="batchListContainer"></div>
            
            <!-- 底部按鈕區塊 (優化 UI 版) -->
            <div class="batch-bottom-actions">
                <div class="batch-action-group">
                    <button class="btn-batch-action btn-import" onclick="document.getElementById('importJsonInput').click()">📂 讀取標籤檔</button>
                    <button class="btn-batch-action btn-export" onclick="exportBatchToJson()">💾 儲存標籤檔</button>
                </div>
                <button class="btn-batch-print" onclick="printBatch()">🖨️ 批次列印 / 匯出多頁 PDF</button>
            </div>
            
            <!-- 隱藏的檔案上傳元素 -->
            <input type="file" id="importJsonInput" accept=".json" style="display: none;" onchange="importBatchFromJson(event)">
        </div>
    </div>
</div>

<div id="batch-print-container"></div>

<script src="tai.js"></script>
</body>
</html>
